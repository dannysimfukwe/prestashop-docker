version: '3.8'
services:
  prestashop:
    build: .
    ports:
      - "8080:80"
    environment:
      - DB_SERVER=db
      - DB_USER=prestashop
      - DB_PASSWD=prestashop
      - DB_NAME=prestashop
      - PS_FOLDER_ADMIN=admin
      - PS_FOLDER_INSTALL=install
    volumes:
      - prestashop:/var/www/html
    depends_on:
      - db
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: prestashop
      MYSQL_USER: prestashop
      MYSQL_PASSWORD: prestashop
    volumes:
      - db:/var/lib/mysql
volumes:
  prestashop:
  db: